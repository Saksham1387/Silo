[project]
name = "e2b-lite"
version = "0.1.0"
description = "A from-scratch v1 of an E2B-style code sandbox, in Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "docker>=7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["e2b_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
